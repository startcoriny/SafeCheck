version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safe-check-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-safe_check}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safe-check-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safe-check-cache
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - safe-check-network

volumes:
  postgres_data:

networks:
  safe-check-network:
    driver: bridge
