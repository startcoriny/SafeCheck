openapi: 3.0.3
info:
  title: SafeCheck API
  description: 실시간 재난·재해 및 사건사고 정보 서비스 API
  version: 0.1.0

servers:
  - url: http://localhost:3000/api/v1
    description: 로컬 개발 서버

tags:
  - name: news
    description: 실시간 사건사고 뉴스 (Phase 2)
  - name: shelter
    description: 대피소 위치 (Phase 3)
  - name: disaster
    description: 재난·재해 알림 (Phase 4)
  - name: rescue
    description: 구조 요청 (Phase 5)
  - name: auth
    description: 인증·인가 (Phase 5)

paths:
  /news:
    get:
      tags: [news]
      summary: 뉴스 목록 조회
      description: |
        필터링을 통과한 사건사고 뉴스 목록을 최신순으로 반환한다.
        is_filtered=true 인 기사만 노출한다.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 페이지 번호
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
          description: 페이지 크기
        - name: region
          in: query
          schema: { type: string }
          description: '시/도 필터 (예: 서울, 부산)'
        - name: district
          in: query
          schema: { type: string }
          description: '시/군/구 필터 (예: 강남구, 해운대구)'
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: 위험도 필터
        - name: accidentType
          in: query
          schema:
            type: string
            enum:
              - FIRE
              - EXPLOSION
              - COLLISION
              - COLLAPSE
              - KNIFE_ATTACK
              - GAS_LEAK
              - FLOOD
              - LANDSLIDE
              - EARTHQUAKE
              - HAZARDOUS_MATERIAL
              - PUBLIC_SAFETY
              - ETC
          description: 사고 유형 필터
        - name: keyword
          in: query
          schema: { type: string }
          description: 키워드 검색 (기사 제목 기준)
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNewsList'
              example:
                success: true
                data:
                  items:
                    - id: 1
                      title: 강남역 인근 흉기난동…2명 사망
                      url: https://n.news.naver.com/article/003/0013976068
                      publisher: 뉴시스
                      publishedAt: '2026-05-29T15:31:00+09:00'
                      collectedAt: '2026-05-29T15:35:00+09:00'
                      accidentType: KNIFE_ATTACK
                      riskLevel: CRITICAL
                      riskScore: 15
                      region: 서울
                      district: 강남구
                  total: 42
                  page: 1
                  limit: 20
                timestamp: '2026-05-29T15:36:00+09:00'

  /news/{id}:
    get:
      tags: [news]
      summary: 뉴스 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 뉴스 ID
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNewsItem'
        '404':
          description: 뉴스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shelters:
    get:
      tags: [shelter]
      summary: 대피소 목록 조회 (Phase 3 구현 예정)
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: radius
          in: query
          schema: { type: number, default: 5 }
          description: 검색 반경 (km)
      responses:
        '200':
          description: Phase 3 구현 후 스키마 확정

  /disaster-alerts:
    get:
      tags: [disaster]
      summary: 재난 알림 목록 (Phase 4 구현 예정)
      responses:
        '200':
          description: Phase 4 구현 후 스키마 확정

  /disaster-alerts/active:
    get:
      tags: [disaster]
      summary: 현재 발효 중인 재난 알림 (Phase 4 구현 예정)
      responses:
        '200':
          description: Phase 4 구현 후 스키마 확정

  /auth/register:
    post:
      tags: [auth]
      summary: 회원가입 (Phase 5 구현 예정)
      responses:
        '201':
          description: Phase 5 구현 후 스키마 확정

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 (Phase 5 구현 예정)
      responses:
        '200':
          description: Phase 5 구현 후 스키마 확정

  /rescue:
    post:
      tags: [rescue]
      summary: 구조 요청 생성 (Phase 5 구현 예정)
      responses:
        '201':
          description: Phase 5 구현 후 스키마 확정

components:
  schemas:
    NewsItem:
      type: object
      required:
        - id
        - title
        - url
        - publisher
        - publishedAt
        - collectedAt
        - accidentType
        - riskLevel
        - riskScore
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 강남역 인근 흉기난동…2명 사망
        url:
          type: string
          example: https://n.news.naver.com/article/003/0013976068
        publisher:
          type: string
          example: 뉴시스
        publishedAt:
          type: string
          format: date-time
        collectedAt:
          type: string
          format: date-time
        accidentType:
          type: string
          enum:
            - FIRE
            - EXPLOSION
            - COLLISION
            - COLLAPSE
            - KNIFE_ATTACK
            - GAS_LEAK
            - FLOOD
            - LANDSLIDE
            - EARTHQUAKE
            - HAZARDOUS_MATERIAL
            - PUBLIC_SAFETY
            - ETC
          example: KNIFE_ATTACK
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          example: CRITICAL
        riskScore:
          type: integer
          example: 15
        region:
          type: string
          nullable: true
          example: 서울
        district:
          type: string
          nullable: true
          example: 강남구

    NewsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20

    ApiResponseNewsItem:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/NewsItem'
        timestamp:
          type: string
          format: date-time

    ApiResponseNewsList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/NewsList'
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
