openapi: 3.0.3
info:
  title: SafeCheck API
  description: 실시간 재난·재해 및 사건사고 정보 서비스 API
  version: 0.1.0

servers:
  - url: http://localhost:3000/api/v1
    description: 로컬 개발 서버
  - url: https://api.safecheck.kr/api/v1
    description: 프로덕션 서버 (예정)

tags:
  - name: news
    description: 실시간 뉴스 정보 (Phase 2)
  - name: shelter
    description: 대피소 위치 (Phase 3)
  - name: disaster
    description: 재난·재해 알림 (Phase 4)
  - name: rescue
    description: 구조 요청 (Phase 5)
  - name: auth
    description: 인증·인가 (Phase 5)

paths:
  # ─── Phase 2: News ─────────────────────────────────────────────────────────
  /news:
    get:
      tags: [news]
      summary: 뉴스 목록 조회
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: region
          in: query
          schema: { type: string }
          description: 지역 필터 (예: 서울, 부산)
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: category
          in: query
          schema:
            type: string
            enum: [DISASTER, ACCIDENT, CRIME, WEATHER, OTHER]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNewsList'

  /news/{id}:
    get:
      tags: [news]
      summary: 뉴스 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNewsItem'
        '404':
          description: 뉴스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Phase 3: Shelter (설계 예정) ──────────────────────────────────────────
  /shelters:
    get:
      tags: [shelter]
      summary: 대피소 목록 조회 (좌표 기반 반경 검색)
      description: Phase 3 구현 예정
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: radius
          in: query
          schema: { type: number, default: 5 }
          description: 검색 반경 (km)
      responses:
        '200':
          description: 성공 (Phase 3 구현 후 스키마 확정)

  # ─── Phase 4: Disaster Alert (설계 예정) ────────────────────────────────────
  /disaster-alerts:
    get:
      tags: [disaster]
      summary: 재난 알림 목록
      description: Phase 4 구현 예정
      responses:
        '200':
          description: 성공 (Phase 4 구현 후 스키마 확정)

  /disaster-alerts/active:
    get:
      tags: [disaster]
      summary: 현재 발효 중인 재난 알림
      description: Phase 4 구현 예정
      responses:
        '200':
          description: 성공 (Phase 4 구현 후 스키마 확정)

  # ─── Phase 5: Auth (설계 예정) ──────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      description: Phase 5 구현 예정
      responses:
        '201':
          description: 가입 성공

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: Phase 5 구현 예정
      responses:
        '200':
          description: 로그인 성공 (access_token, refresh_token 반환)

  # ─── Phase 5: Rescue (설계 예정) ────────────────────────────────────────────
  /rescue:
    post:
      tags: [rescue]
      summary: 구조 요청 생성 (비회원 가능)
      description: Phase 5 구현 예정
      responses:
        '201':
          description: 요청 생성 성공

components:
  schemas:
    NewsItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        source: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        category:
          type: string
          enum: [DISASTER, ACCIDENT, CRIME, WEATHER, OTHER]
        region: { type: string }
        createdAt: { type: string, format: date-time }

    NewsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    ApiResponseNewsItem:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/NewsItem'
        timestamp: { type: string, format: date-time }

    ApiResponseNewsList:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/NewsList'
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
